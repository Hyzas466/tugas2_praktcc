<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Notes - Tugas 2 TCC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Aplikasi Notes</h1>

        <div class="form-container">
            <h2 id="form-title">Tambah Catatan Baru</h2>
            <form id="note-form">
                <input type="hidden" id="note-id">

                <div class="form-group">
                    <label for="judul">Judul Catatan</label>
                    <input type="text" id="judul" placeholder="Masukkan judul..." required>
                </div>

                <div class="form-group">
                    <label for="isi">Isi Catatan</label>
                    <textarea id="isi" rows="4" placeholder="Tuliskan isi catatan di sini..." required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">Simpan Catatan</button>
                <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;">Batal Edit</button>
            </form>
        </div>

        <div class="notes-container">
            <h2>Daftar Catatan</h2>
            <div id="notes-list">
                <p>Memuat catatan...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
